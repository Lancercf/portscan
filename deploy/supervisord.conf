[program:portscan-server]
command=gunicorn -w 8 server:app
autostart=false
autorestart=false
directory=/data0/portscan/
redirect_stderr=true
stdout_logfile = /data0/portscan/log/server.log

[program:portscan-scheduler]
command=python scheduler.py --nmap=20 --masscan=1
autostart=false
autorestart=false
directory=/data0/portscan/
redirect_stderr=true
stdout_logfile = /data0/portscan/log/scheduler.log
